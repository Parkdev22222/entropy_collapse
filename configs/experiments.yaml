# STEER-F 실험 매트릭스 및 Ablation 설정.
#
# 각 항목은 run/run_steerf_linear.sh 에 넘길 환경변수 집합이다.
# 재현성을 위해 전 실험을 시드 3개(42, 43, 44)로 반복한다.
#
#   for SEED in 42 43 44; do
#     SEED=$SEED LAMBDA=0.5 KAPPA=4 GAMMA_H=0.85 \
#       MTP_HEADS=artifacts/mtp_heads.pt bash run/run_steerf_linear.sh
#   done
#
# 주의: Phase 1이 (κ, γ_H)를 결정하기 전에는 아래 kappa/gamma_h 값이 자리표시자다.
# phase1_validate.py 실행 후 artifacts/phase1/phase1_result.json 의 값으로 교체할 것.

defaults:
  kappa: 4              # Phase 1 결정 대기 (자리표시자)
  gamma_h: 0.85         # Phase 1 결정 대기 (자리표시자)
  clip_c: 1.0
  eta: 1.0
  steerf_norm: z
  baseline: sibling
  beta_mtp: 0.05
  drift_kl: 0.5
  rollout_n: 8
  seeds: [42, 43, 44]

# ---------------------------------------------------------------- Phase 2
# E2-1: 소형 모델, λ 스윕 (주 비교)
E2-1:
  model: Qwen/Qwen2.5-1.5B-Instruct
  runs:
    - {name: grpo,        loss_mode: vanilla}
    - {name: steer,       lambda: 0.0}
    - {name: steerf-0.25, lambda: 0.25}
    - {name: steerf-0.5,  lambda: 0.5}
    - {name: steerf-1.0,  lambda: 1.0}

# E2-2: 7B 스케일 확인 (최적 λ만)
E2-2:
  model: Qwen/Qwen2.5-Math-7B
  runs:
    - {name: grpo,   loss_mode: vanilla}
    - {name: steer,  lambda: 0.0}
    - {name: steerf, lambda: BEST_FROM_E2_1}

# ---------------------------------------------------------------- Phase 3
# 하이퍼파라미터는 Qwen 값 그대로 사용 ("그대로 작동"이 주장 포인트).
# 캘리브레이션만 모델별로 재산출한다.
E3:
  models:
    - meta-llama/Llama-3.2-3B-Instruct
    - LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
  runs:
    - {name: grpo,   loss_mode: vanilla}
    - {name: steer,  lambda: 0.0}
    - {name: steerf, lambda: BEST_FROM_E2_1}
  notes:
    - "사전에 scripts/phase3_port_model.py passrate 로 전부-오답 그룹 비율 확인"
    - "all_wrong_frac > 0.5 이면 난이도 하위 서브셋으로 조정하고 보고서에 명시"
    - "EXAONE은 한국어 수학 벤치 1종(HRM8K 등) 추가"

# ---------------------------------------------------------------- Phase 4
ablations:
  A1_kappa:
    vary: KAPPA
    values: [2, 4, 8]
    question: "Phase 1에서 고른 κ가 RL 하에서도 최적인가"
  A2_gamma_h:
    vary: GAMMA_H
    values: [0.7, 0.85, 1.0]
    question: "할인 민감도"
  A3_lambda:
    vary: LAMBDA
    values: [0, 0.1, 0.25, 0.5, 1.0, 2.0]
    question: "과도한 미래 항의 해악. 큰 λ에서 붕괴 예상"
  A4_future_only:
    vary: LOCAL_SCALE           # policy_loss.steerf_local_scale
    values: [1.0, 0.0]          # 0.0 = 미래 항만
    question: "로컬 항 제거 시 미래 항 단독 기여"
  A5_baseline:
    vary: BASELINE
    values: [sibling, group]
    question: "baseline 품질의 영향"
  A6_calibration:
    vary: CALIBRATION
    values: [on, off]
    question: "먼 헤드 과대추정 편향의 실제 영향"
    note: "헤드 체크포인트의 calibration 필드 유무로 전환"
  A7_mtp_aux:
    vary: BETA_MTP
    values: [0.05, 0.0]
    question: "예보 낡음(staleness)의 실제 해악. 0 = 헤드 freeze"

# ---------------------------------------------------------------- 평가
evaluation:
  benchmarks: [math500, aime24, aime25, amc23, minerva_math, olympiadbench]
  sampling: {temperature: 0.7, top_p: 0.9, n: 16}
  metrics: [pass@1, pass@16, self_bleu, embedding_logdet]
  mid_training_checkpoints: [0.25, 0.50, 0.75]   # Phase 1 상관 재측정 지점

# ---------------------------------------------------------------- 필수 로깅
logging:
  - policy_entropy
  - steerf/entropy_branch            # 분기 토큰만의 엔트로피 (메커니즘 확인)
  - steerf/entropy_branch_minus_all
  - steerf/alpha_frac_low            # α 3구간 비율
  - steerf/alpha_frac_mid
  - steerf/alpha_frac_high
  - steerf/alpha_saturated           # 한쪽 90%+ 이면 정규화 재검토 신호
  - steerf/future_frac               # Ω̃ 두 항의 상대 크기
  - steerf/a_h_clip_frac             # clip_c가 너무 빡빡한지
  - steerf/forecast_policy_kl        # 예보 표류
  - steerf/lam_effective             # 표류 감쇠 후 실효 λ
  - steerf/mtp_ce
  - reward
